<style id="khd-arena-style">
#khd-arena-intro{position:fixed;inset:0;z-index:1000000;overflow:hidden;background:#030305;color:#fff;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;perspective:900px;animation:khdFade 3.8s ease forwards}

"🐾":'<ellipse cx="12" cy="16" rx="6" ry="5"/><ellipse cx="5" cy="9" rx="2" ry="3"/><ellipse cx="10" cy="5" rx="2" ry="3"/><ellipse cx="15" cy="5" rx="2" ry="3"/><ellipse cx="20" cy="9" rx="2" ry="3"/>',
"😎":'<circle cx="12" cy="12" r="10"/><path d="M3 10h7l2 3 2-3h7M8 17q4 3 8 0"/>',
"👑":'<path d="m3 7 5 5 4-8 4 8 5-5-2 13H5zM5 23h14"/>',
"💀":'<circle cx="12" cy="10" r="8"/><path d="M7 15v5h10v-5M9 10h.1m6 0h.1m-5 4h4"/>',
"😈":'<path d="m5 5 4 3q3-2 6 0l4-3 2 9q-1 6-9 8-8-2-9-8zM8 11l4 3 4-3"/>'
};
const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const keys=Object.keys(icons).sort((a,b)=>b.length-a.length);
const re=new RegExp(keys.map(esc).join('|'),'gu');
function convert(root){
if(!root||!root.querySelectorAll)return;
const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
for(const n of nodes){
if(!n.parentElement||n.parentElement.closest('script,style,textarea,input,button,.khd-avatar-premium,[contenteditable="true"]'))continue;
const v=n.nodeValue;re.lastIndex=0;if(!re.test(v)){continue}re.lastIndex=0;
const f=document.createDocumentFragment();let last=0,m;
while((m=re.exec(v))){
f.append(document.createTextNode(v.slice(last,m.index)));
const e=document.createElement('span');
e.className='khd-avatar-premium';
e.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+icons[m[0]]+'</svg>';
e.setAttribute('aria-label','Premium avatar');
f.append(e);last=m.index+m[0].length;
}
f.append(document.createTextNode(v.slice(last)));n.replaceWith(f);
}
}
function run(){
convert(document.body);
new MutationObserver(records=>records.forEach(r=>{
r.addedNodes.forEach(n=>{if(n.nodeType===1)convert(n)});
if(r.type==='characterData'&&r.target.parentElement)convert(r.target.parentElement);
})).observe(document.body,{subtree:true,childList:true,characterData:true});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
})();
</script>

<style id="KHD_PREMIUM_EMOJIS">
.khd-premium-emoji {
  display: inline-block;
  font-family: "Apple Color Emoji","Noto Color Emoji",sans-serif;
  filter: drop-shadow(0 2px 3px rgba(168,85,247,.38));
  transform-origin: center;
  transition: filter .2s ease, transform .2s ease;
}
button .khd-premium-emoji { vertical-align: -0.08em; }
button:active .khd-premium-emoji {
  transform: scale(.92);
}
</style>
<script>
(function(){
  const mark = 'khd-premium-emoji';
  const emoji = /(?:\p{Regional_Indicator}{2}|[#*0-9]\uFE0F?\u20E3|\p{Extended_Pictographic}(?:\uFE0F|\uFE0E)?(?:\p{Emoji_Modifier})?(?:\u200D\p{Extended_Pictographic}(?:\uFE0F|\uFE0E)?(?:\p{Emoji_Modifier})?)*)/gu;
  function decorate(root){
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while(walker.nextNode()){
      const n = walker.currentNode;
      if(n.parentElement && !n.parentElement.closest('script,style,textarea,input,.khd-premium-emoji,[contenteditable="true"]') && emoji.test(n.textContent)){
        emoji.lastIndex = 0;
        if(emoji.test(n.textContent)) nodes.push(n);
        emoji.lastIndex = 0;
      }
    }
    nodes.forEach(n=>{
      const frag = document.createDocumentFragment();
      let last = 0, match;
      emoji.lastIndex = 0;
      while((match = emoji.exec(n.textContent)) !== null){
        frag.append(document.createTextNode(n.textContent.slice(last, match.index)));
        const span = document.createElement('span');
        span.className = mark;
        span.textContent = match[0];
        frag.append(span);
        last = match.index + match[0].length;
      }
      frag.append(document.createTextNode(n.textContent.slice(last)));
      n.replaceWith(frag);
    });
  }
  function start(){
    decorate(document.body);
    new MutationObserver(records=>{
      records.forEach(r=>r.addedNodes.forEach(n=>{
        if(n.nodeType===Node.TEXT_NODE && n.parentElement && !n.parentElement.closest('script,style,textarea,input,.khd-premium-emoji,[contenteditable="true"]')){
          const parent=n.parentElement;
          decorate(parent);
        } else if(n.nodeType===Node.ELEMENT_NODE && !n.matches('script,style')) decorate(n);
      }));
    }).observe(document.body,{childList:true,subtree:true});
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start,{once:true});
  else start();
})();
</script>


<script id="khd-free-voice">
(function(){
  if (!("speechSynthesis" in window)) {
    console.log("Brauzer ovozni qo‘llamaydi");
    return;
  }

  let lastPhase = "";
  let timer;

  function speak(text) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "uz-UZ";
    u.rate = 0.82;
    u.pitch = 0.72;
    u.volume = 1;
    const voices = speechSynthesis.getVoices();
    const uz = voices.find(v => /^uz([-_]|$)/i.test(v.lang));
    if (uz) u.voice = uz;
    speechSynthesis.speak(u);
  }

  function checkPhase() {
    const text = document.body.innerText || "";
    const night = /tun boshlandi|tungi bosqich|night started|^\s*(?:tun|night)\s*$/im.test(text);
    const day = /kun boshlandi|kunduz boshlandi|day started|^\s*(?:kun|day)\s*$/im.test(text);
    const phase = night ? "night" : day ? "day" : "";

    if (phase && phase !== lastPhase) {
      lastPhase = phase;
      speak(phase === "night"
        ? "Tun tushdi. Hamma jim bo‘lsin."
        : "Tong otdi. Kun boshlandi. Hushyor bo‘ling.");
    }
  }

  new MutationObserver(() => {
    clearTimeout(timer);
    timer = setTimeout(checkPhase, 500);
  }).observe(document.body, {
    childList: true, subtree: true, characterData: true
  });

  window.khdTestVoice = () => speak("KH.D Mafia. O‘yin boshlandi.");
  console.log("KH.D bepul ovoz tizimi tayyor");
})();
</script>

const pattern=new RegExp(Object.keys(icons).sort((a,b)=>b.length-a.length).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'gu');
function scan(root){
if(!root||root.nodeType!==1&&root.nodeType!==9)return;
const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);

}
frag.append(document.createTextNode(value.slice(last)));node.replaceWith(frag);
}
}
